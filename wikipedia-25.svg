<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" width="220" height="48" role="img" aria-label="Wikipedia 25 Years of the Free Encyclopedia">
  <defs>
    <linearGradient id="puzzleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3366cc" />
      <stop offset="100%" stop-color="#1b449c" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Wikipedia Wordmark -->
  <g id="wordmark">
    <!-- W -->
    <text x="0" y="27" font-family="'Linux Libertine', 'Georgia', 'Times New Roman', serif" font-size="25" font-weight="normal" letter-spacing="1.5" fill="currentColor" class="wiki-brand-text">WIKIPEDI<tspan dx="-0.5">A</tspan></text>
  </g>

  <!-- 25 Puzzle Piece Emblem -->
  <g transform="translate(148, 6)" filter="url(#subtleShadow)">
    <!-- Puzzle Piece base -->
    <path d="M 4 2 
             C 4 2, 10 2, 14 2 
             C 14 6, 17 8, 20 8 
             C 23 8, 26 6, 26 2 
             C 30 2, 36 2, 36 2 
             C 36 7, 36 12, 36 15 
             C 40 15, 42 18, 42 21 
             C 42 24, 40 27, 36 27 
             C 36 31, 36 35, 36 35 
             C 31 35, 27 35, 27 35 
             C 27 31, 24 29, 21 29 
             C 18 29, 15 31, 15 35 
             C 9 35, 4 35, 4 35 
             C 4 29, 4 24, 4 24 
             C 8 24, 10 21, 10 18 
             C 10 15, 8 12, 4 12 Z" 
          fill="url(#puzzleGrad)" />
    <!-- 25 text on puzzle piece -->
    <text x="21" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">25</text>
  </g>

  <!-- Tagline: 25 years of the free encyclopedia -->
  <text x="2" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#54595d" class="wiki-tagline-text" letter-spacing="0.1">25 years of the free encyclopedia</text>
</svg>
