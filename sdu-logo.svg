<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="210" height="44" role="img" aria-label="서울디지털대학교 Seoul Digital University">
  <defs>
    <linearGradient id="sduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003e8a"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="sduAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
  </defs>

  <!-- SDU Emblem / Icon -->
  <g transform="translate(4, 5)">
    <!-- Outer Shield / Circle Base -->
    <rect x="0" y="0" width="38" height="38" rx="8" fill="url(#sduGrad)" />
    <!-- Dynamic Digital Arch / Orbit -->
    <path d="M 7 24 C 10 14, 28 10, 31 18 C 33 22, 28 28, 19 28" fill="none" stroke="url(#sduAccent)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- SDU Monogram in emblem -->
    <text x="19" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">SDU</text>
    <circle cx="28" cy="12" r="2.5" fill="#ffb74d" />
  </g>

  <!-- Typography: 서울디지털대학교 -->
  <g transform="translate(50, 0)">
    <text x="0" y="24" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="800" fill="currentColor" class="sdu-text-main" letter-spacing="-0.5">
      서울디지털대학교
    </text>
    <text x="1" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#0066cc" class="sdu-text-sub" letter-spacing="1">
      SEOUL DIGITAL UNIVERSITY
    </text>
  </g>
</svg>
